# spike/008 实验稿（002 §2.2；模拟 .agentos/mcp_servers.yaml 形态）
# 四字段：name / transport / command / env（字段定义 TS 6.4；语义由本 spike M7 验证）
# env 值只允许 ${环境变量名} 占位符或非敏感值（TS 8.8 密钥红线延伸）
servers:
  - name: everything
    transport: stdio
    command: "npx -y @modelcontextprotocol/server-everything"
    env:
      MCP_SPIKE_PROBE: ${MCP_SPIKE_PROBE}   # 占位符通路验证用（M7）；非凭证；不设缺省值——缺失即报错正是要验证的行为
  - name: filesystem
    transport: stdio
    command: "npx -y @modelcontextprotocol/server-filesystem ./sandbox-dir"
    env: {}
