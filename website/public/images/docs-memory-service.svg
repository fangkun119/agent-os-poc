<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <defs>
    <marker id="tmg1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="60" y="20" width="320" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="220" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">ReActLoop / PromptBuilder（读）</text>
  <rect x="440" y="20" width="320" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="600" y="50" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">MemoryTools（写：save_memory / recall_memory）</text>
  <line x1="220" y1="70" x2="220" y2="90" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="600" y1="70" x2="600" y2="90" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="220" y1="90" x2="600" y2="90" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="410" y1="90" x2="410" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#tmg1)"/>
  <rect x="210" y="112" width="400" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.6"/>
  <text x="410" y="138" fill="#15803d" font-size="16" font-weight="bold" text-anchor="middle">MemoryService（门面）</text>
  <text x="410" y="158" fill="#166534" font-size="12" text-anchor="middle">统一门面，读写都走这里</text>
  <line x1="410" y1="168" x2="410" y2="188" stroke="#22c55e" stroke-width="1.8"/>
  <line x1="180" y1="188" x2="640" y2="188" stroke="#22c55e" stroke-width="1.8"/>
  <line x1="180" y1="188" x2="180" y2="218" stroke="#22c55e" stroke-width="1.8" marker-end="url(#tmg1)"/>
  <line x1="640" y1="188" x2="640" y2="218" stroke="#22c55e" stroke-width="1.8" marker-end="url(#tmg1)"/>
  <rect x="40" y="220" width="280" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="244" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">SessionManager</text>
  <text x="180" y="264" fill="#1e40af" font-size="11" text-anchor="middle">会话记忆 · SQLite</text>
  <rect x="360" y="220" width="440" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2.2"/>
  <text x="580" y="240" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">LongTermMemoryStore（接口）</text>
  <text x="580" y="258" fill="#64748b" font-size="10" text-anchor="middle">append / load / recallByKeyword / truncateIfNeeded</text>
  <line x1="580" y1="266" x2="580" y2="282" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="410" y1="282" x2="750" y2="282" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="410" y1="282" x2="410" y2="298" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tmg1)"/>
  <line x1="580" y1="282" x2="580" y2="298" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tmg1)"/>
  <line x1="750" y1="282" x2="750" y2="298" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tmg1)"/>
  <rect x="340" y="300" width="140" height="52" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="321" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">MarkdownMemoryStore</text>
  <text x="410" y="337" fill="#92400e" font-size="9" text-anchor="middle">默认 · MEMORY.md</text>
  <text x="410" y="348" fill="#92400e" font-size="9" text-anchor="middle">核心/归档分区</text>
  <rect x="510" y="300" width="140" height="52" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="580" y="321" fill="#075985" font-size="10" font-weight="bold" text-anchor="middle">SqliteMemoryStore</text>
  <text x="580" y="337" fill="#075985" font-size="9" text-anchor="middle">memory_entries 表</text>
  <text x="580" y="348" fill="#075985" font-size="9" text-anchor="middle">LIMIT 截断 · LIKE 检索</text>
  <rect x="680" y="300" width="140" height="52" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="750" y="321" fill="#6d28d9" font-size="10" font-weight="bold" text-anchor="middle">Mem0MemoryStore</text>
  <text x="750" y="337" fill="#6d28d9" font-size="9" text-anchor="middle">自托管 Mem0</text>
  <text x="750" y="348" fill="#6d28d9" font-size="9" text-anchor="middle">语义检索 · REST</text>
  <text x="410" y="384" fill="#64748b" font-size="12" text-anchor="middle">上层只认 MemoryService 一个接口；长期记忆经 LongTermMemoryStore 接口按 memory.backend 三选一，换后端上层一个字不动</text>
</svg>
