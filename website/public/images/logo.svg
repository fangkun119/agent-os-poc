<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="AgentOS logo">
  <defs>
    <linearGradient id="aos-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#123B69"/>
    </linearGradient>
    <linearGradient id="aos-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- OS tile: rounded square base -->
  <rect x="14" y="14" width="212" height="212" rx="52" fill="url(#aos-bg)"/>

  <!-- layered rings: 接入层 → 引擎层 → 内核 -->
  <rect x="42" y="42" width="156" height="156" rx="38" fill="none" stroke="#7DD3FC" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="68" y="68" width="104" height="104" rx="26" fill="none" stroke="#5EEAD4" stroke-opacity="0.5" stroke-width="3"/>

  <!-- hub: AgentService 统一入口 -->
  <circle cx="120" cy="120" r="30" fill="url(#aos-core)"/>
  <circle cx="120" cy="120" r="12" fill="#0F2A4A"/>

  <!-- agents: three trigger sources / managed agents -->
  <g stroke="#A5F3FC" stroke-width="3.5" stroke-linecap="round">
    <line x1="120" y1="120" x2="120" y2="58"/>
    <line x1="120" y1="120" x2="174" y2="151"/>
    <line x1="120" y1="120" x2="66" y2="151"/>
  </g>
  <g fill="#E0F2FE">
    <circle cx="120" cy="52" r="10"/>
    <circle cx="181" cy="155" r="10"/>
    <circle cx="59" cy="155" r="10"/>
  </g>

  <!-- circuit ticks on the outer ring: OS / kernel texture -->
  <g stroke="#7DD3FC" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="26" x2="120" y2="36"/>
    <line x1="120" y1="204" x2="120" y2="214"/>
    <line x1="26" y1="120" x2="36" y2="120"/>
    <line x1="204" y1="120" x2="214" y2="120"/>
  </g>
</svg>
