<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="tsda" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="tsdar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <rect x="14" y="14" width="150" height="28" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="89" y="27" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">FileTools</text>
  <text x="89" y="37" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <rect x="14" y="44" width="150" height="28" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="89" y="57" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">ShellTools</text>
  <text x="89" y="67" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <rect x="14" y="74" width="150" height="28" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="89" y="87" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">HttpTools</text>
  <text x="89" y="97" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <rect x="14" y="104" width="150" height="28" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="89" y="117" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">NotifyTools</text>
  <text x="89" y="127" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <line x1="164" y1="28" x2="250" y2="55" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="164" y1="58" x2="250" y2="68" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="164" y1="88" x2="250" y2="81" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="164" y1="118" x2="250" y2="94" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <text x="207" y="24" fill="#64748b" font-size="8.5" text-anchor="middle">sandboxActions 申报</text>
  <rect x="250" y="40" width="180" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.6"/>
  <text x="340" y="64" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">ToolExecutor</text>
  <text x="340" y="82" fill="#4c1d95" font-size="9.5" text-anchor="middle">执行入口 · 单一咽喉</text>
  <text x="340" y="98" fill="#4c1d95" font-size="8.5" text-anchor="middle">各 Tool 只申报动作、不自行调用 check</text>
  <line x1="430" y1="75" x2="486" y2="75" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <text x="458" y="67" fill="#64748b" font-size="9" text-anchor="middle">统一解析</text>
  <rect x="490" y="40" width="190" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.6"/>
  <text x="585" y="62" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">TargetParser</text>
  <text x="585" y="80" fill="#4c1d95" font-size="9.5" text-anchor="middle">.parse(action)</text>
  <text x="585" y="96" fill="#4c1d95" font-size="8.5" text-anchor="middle">产出 ParsedTarget · 唯一 URL 解析器</text>
  <line x1="585" y1="110" x2="585" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <rect x="490" y="134" width="190" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="585" y="156" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">SandboxChecker</text>
  <text x="585" y="174" fill="#92400e" font-size="10" text-anchor="middle">.check(action, target)</text>
  <text x="585" y="188" fill="#92400e" font-size="8.5" text-anchor="middle">未知 ActionType 默认拒绝</text>
  <line x1="585" y1="194" x2="585" y2="212" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <text x="596" y="207" fill="#64748b" font-size="8.5" text-anchor="start">按动作类型分流</text>
  <rect x="475" y="218" width="220" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="585" y="236" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">target.kind 四态分流</text>
  <text x="585" y="252" fill="#15803d" font-size="8.5" text-anchor="middle">IP_LITERAL（IP 字面量）→ 放行</text>
  <text x="585" y="266" fill="#b91c1c" font-size="8.5" text-anchor="middle">INVALID（解析失败）→ 一律拒绝</text>
  <text x="585" y="280" fill="#64748b" font-size="8.5" text-anchor="middle">NOT_APPLICABLE（非 URL 动作）→ 仅文件 / Shell</text>
  <text x="585" y="294" fill="#64748b" font-size="8.5" text-anchor="middle">HTTP / NOTIFY 出现即拒绝</text>
  <text x="585" y="308" fill="#92400e" font-size="8.5" text-anchor="middle">NAMED（域名形式）→ 进入下方白名单判定</text>
  <line x1="585" y1="314" x2="585" y2="334" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="109" y1="334" x2="585" y2="334" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="109" y1="334" x2="109" y2="344" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="317" y1="334" x2="317" y2="344" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="525" y1="334" x2="525" y2="344" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <rect x="14" y="344" width="190" height="28" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="109" y="357" fill="#4338ca" font-size="12" font-weight="bold" text-anchor="middle">HTTP GET</text>
  <text x="109" y="368" fill="#4c1d95" font-size="8.5" text-anchor="middle">kind：NAMED / IP_LITERAL</text>
  <rect x="222" y="344" width="190" height="28" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="317" y="357" fill="#4338ca" font-size="12" font-weight="bold" text-anchor="middle">HTTP 非 GET</text>
  <text x="317" y="368" fill="#4c1d95" font-size="8" text-anchor="middle">NAMED 查白名单 / IP_LITERAL 放行</text>
  <rect x="430" y="344" width="190" height="28" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="525" y="357" fill="#4338ca" font-size="12" font-weight="bold" text-anchor="middle">NOTIFY 通知</text>
  <text x="525" y="368" fill="#4c1d95" font-size="8" text-anchor="middle">NAMED 查白名单 / IP_LITERAL 放行</text>
  <line x1="109" y1="372" x2="109" y2="384" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="317" y1="372" x2="317" y2="384" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="525" y1="372" x2="525" y2="384" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <rect x="14" y="384" width="190" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="109" y="399" fill="#64748b" font-size="10.5" font-weight="bold" text-anchor="middle">免域名白名单</text>
  <text x="109" y="411" fill="#64748b" font-size="8.5" text-anchor="middle">NAMED + GET 直接放行</text>
  <rect x="222" y="384" width="190" height="34" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="317" y="399" fill="#b45309" font-size="10.5" font-weight="bold" text-anchor="middle">域名白名单</text>
  <text x="317" y="411" fill="#92400e" font-size="8" text-anchor="middle">agentos.sandbox.http.allowed-domains</text>
  <rect x="430" y="384" width="190" height="34" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="525" y="399" fill="#b45309" font-size="10.5" font-weight="bold" text-anchor="middle">通知域名白名单</text>
  <text x="525" y="411" fill="#92400e" font-size="8" text-anchor="middle">agentos.sandbox.notify.allowed-domains</text>
  <line x1="109" y1="418" x2="109" y2="430" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="317" y1="418" x2="317" y2="430" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="525" y1="418" x2="525" y2="430" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <rect x="14" y="430" width="606" height="28" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="317" y="448" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">校验通过（NAMED 命中白名单 / NAMED+GET 豁免 / IP_LITERAL 放行）→ 继续执行 Tool（写审计 tool_invocations）</text>
  <line x1="317" y1="458" x2="317" y2="470" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <rect x="14" y="470" width="606" height="44" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="317" y="487" fill="#4338ca" font-size="10.5" font-weight="bold" text-anchor="middle">HttpRedirectExecutor（执行层）</text>
  <text x="317" y="503" fill="#4c1d95" font-size="8.5" text-anchor="middle">显式重定向循环跟随 · 上限 agentos.sandbox.http.max-redirect（缺省 5）</text>
  <rect x="700" y="134" width="170" height="130" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="785" y="168" fill="#b91c1c" font-size="9.5" text-anchor="middle">任一校验不通过</text>
  <text x="785" y="188" fill="#b91c1c" font-size="8.5" text-anchor="middle">INVALID 短路 → 直接返回确定性失败</text>
  <text x="785" y="212" fill="#b91c1c" font-size="8" font-weight="bold" text-anchor="middle">策略拒绝 → 抛 SandboxViolationException</text>
  <text x="785" y="234" fill="#991b1b" font-size="9" text-anchor="middle">写审计 tool_invocations</text>
  <text x="785" y="252" fill="#991b1b" font-size="9" text-anchor="middle">ToolExecutor 统一收尾</text>
  <line x1="680" y1="164" x2="700" y2="164" stroke="#ef4444" stroke-width="1.8" marker-end="url(#tsdar)"/>
  <text x="14" y="524" fill="#475569" font-size="8.5" text-anchor="start">文件类动作 → 先判「当前 Agent 目录隐式放行」（仅 FILE_READ、含 list_dir），未命中再走路径白名单 agentos.sandbox.file.allowed-paths</text>
  <text x="14" y="537" fill="#475569" font-size="8.5" text-anchor="start">Shell → 命令白名单 agentos.sandbox.shell.allowed-commands（绝对路径精确匹配）</text>
  <text x="14" y="550" fill="#64748b" font-size="8.5" text-anchor="start">MCP 工具与 @Tool Bean 返回空清单＝豁免；放行与拒绝都走 ToolExecutor 既有审计路径（tool_invocations），不新增审计代码</text>
</svg>
