<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <defs>
    <marker id="tsda" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="40" y="25" width="210" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="145" y="44" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">FileTools</text>
  <text x="145" y="59" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <rect x="40" y="85" width="210" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="145" y="104" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">ShellTools</text>
  <text x="145" y="119" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <rect x="40" y="145" width="210" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="145" y="164" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">HttpTools</text>
  <text x="145" y="179" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <rect x="40" y="205" width="210" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="145" y="224" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">NotifyTools</text>
  <text x="145" y="239" fill="#1d4ed8" font-size="8" text-anchor="middle">.sandboxActions(inputJson)</text>
  <line x1="250" y1="48" x2="318" y2="75" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="250" y1="108" x2="318" y2="91" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="250" y1="168" x2="318" y2="107" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <line x1="250" y1="228" x2="318" y2="123" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <text x="284" y="36" fill="#64748b" font-size="8.5" text-anchor="middle">sandboxActions 申报</text>
  <rect x="320" y="58" width="230" height="66" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.6"/>
  <text x="435" y="82" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">ToolExecutor</text>
  <text x="435" y="99" fill="#4c1d95" font-size="9.5" text-anchor="middle">执行入口 · 单一咽喉</text>
  <text x="435" y="114" fill="#4c1d95" font-size="8.5" text-anchor="middle">各 Tool 只申报动作、不自行调用 check</text>
  <line x1="435" y1="124" x2="435" y2="148" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <text x="458" y="140" fill="#64748b" font-size="9" text-anchor="middle">统一校验</text>
  <rect x="320" y="150" width="230" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="435" y="173" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">SandboxChecker</text>
  <text x="435" y="189" fill="#92400e" font-size="10" text-anchor="middle">.check(actions)</text>
  <text x="435" y="203" fill="#92400e" font-size="8.5" text-anchor="middle">未知 ActionType 默认拒绝</text>
  <line x1="435" y1="208" x2="435" y2="222" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tsda)"/>
  <polygon points="435,224 545,255 435,286 325,255" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="435" y="251" fill="#475569" font-size="9.5" text-anchor="middle">命令/路径/域名/</text>
  <text x="435" y="264" fill="#475569" font-size="9.5" text-anchor="middle">通知域名在白名单里？</text>
  <line x1="545" y1="255" x2="583" y2="255" stroke="#22c55e" stroke-width="1.8" marker-end="url(#tsda)"/>
  <text x="563" y="246" fill="#16a34a" font-size="11" text-anchor="middle">是</text>
  <rect x="585" y="232" width="190" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="260" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">继续执行 Tool</text>
  <line x1="435" y1="286" x2="435" y2="318" stroke="#ef4444" stroke-width="1.8" marker-end="url(#tsda)"/>
  <text x="455" y="306" fill="#dc2626" font-size="11" text-anchor="middle">否</text>
  <rect x="320" y="320" width="230" height="44" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="435" y="347" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle">抛 SandboxViolationException</text>
  <text x="150" y="272" fill="#475569" font-size="9" text-anchor="middle">路径 → file.allowed_paths</text>
  <text x="150" y="287" fill="#475569" font-size="9" text-anchor="middle">命令 → shell.allowed_commands</text>
  <text x="150" y="302" fill="#475569" font-size="9" text-anchor="middle">域名 → http.allowed_domains</text>
  <text x="150" y="317" fill="#475569" font-size="9" text-anchor="middle">通知域名 → notify.allowed_domains（独立白名单）</text>
  <text x="410" y="388" fill="#64748b" font-size="10.5" text-anchor="middle">MCP 工具与 @Tool Bean 返回空清单＝豁免；放行与拒绝都走 ToolExecutor 既有审计路径，不新增审计代码</text>
</svg>
