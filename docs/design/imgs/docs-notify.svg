<svg viewBox="0 0 820 316" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="316" fill="#ffffff"/>
  <defs>
    <marker id="tnf1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="tnfa" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="270" y="20" width="280" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="43" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">NotifyTools</text>
  <text x="410" y="61" fill="#4f46e5" font-size="11" text-anchor="middle">.notify(content, channel)</text>
  <line x1="410" y1="70" x2="410" y2="96" stroke="#94a3b8" stroke-width="2" marker-end="url(#tnf1)"/>
  <rect x="185" y="98" width="450" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="124" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">NotifyChannelAdapter（接口）</text>
  <text x="410" y="144" fill="#92400e" font-size="11" text-anchor="middle">表达"送到某个通知目标"，不携带具体渠道细节</text>
  <text x="410" y="159" fill="#92400e" font-size="9.5" text-anchor="middle">send → NotifySendResult（success / errorMessage / content / redirectChain / finalStatus / retryable）</text>
  <line x1="410" y1="168" x2="410" y2="180" stroke="#f59e0b" stroke-width="2"/>
  <line x1="200" y1="180" x2="620" y2="180" stroke="#f59e0b" stroke-width="2"/>
  <line x1="200" y1="180" x2="200" y2="204" stroke="#f59e0b" stroke-width="2" marker-end="url(#tnfa)"/>
  <line x1="620" y1="180" x2="620" y2="204" stroke="#f59e0b" stroke-width="2" marker-end="url(#tnfa)"/>
  <rect x="60" y="206" width="280" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="223" fill="#1d4ed8" font-size="10.5" font-weight="bold" text-anchor="middle">核心阶段：WebhookNotifyAdapter</text>
  <text x="200" y="237" fill="#1e40af" font-size="9" text-anchor="middle">类名为历史命名，不强制更名</text>
  <text x="200" y="251" fill="#1e40af" font-size="10" text-anchor="middle">通用 HTTP webhook，核心阶段唯一实现</text>
  <rect x="480" y="206" width="280" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="620" y="223" fill="#15803d" font-size="10.5" font-weight="bold" text-anchor="middle">核心阶段：按渠道类型分派</text>
  <text x="620" y="237" fill="#166534" font-size="9" text-anchor="middle">lark / wecom / dingtalk / webhook 四种 webhook 模板</text>
  <text x="620" y="251" fill="#166534" font-size="10" text-anchor="middle">扩展阶段：各渠道专用接口适配器（可选）</text>
  <text x="410" y="278" fill="#64748b" font-size="11" text-anchor="middle">NOTIFY 由 NotifyTools 申报、ToolExecutor 统一校验 → agentos.sandbox.notify.allowed-domains 独立白名单</text>
  <text x="410" y="294" fill="#64748b" font-size="11" text-anchor="middle">只要接口不变，webhook 换成专用 Adapter，NotifyTools 一行不用改</text>
</svg>
