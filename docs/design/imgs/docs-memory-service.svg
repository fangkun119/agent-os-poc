<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="460" fill="#ffffff"/>
  <defs>
    <marker id="tmg1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="tmg2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
  <rect x="60" y="20" width="320" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="220" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">ReActLoop / PromptBuilder（读）</text>
  <rect x="420" y="20" width="380" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="610" y="50" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">MemoryTools（写：save_memory / recall_memory）</text>
  <line x1="220" y1="70" x2="220" y2="82" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="220" y1="82" x2="410" y2="82" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="410" y1="82" x2="410" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#tmg1)"/>
  <rect x="286" y="90" width="248" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="108" fill="#4338ca" font-size="12" font-weight="bold" text-anchor="middle">LongTermMemoryView（core 读接口）</text>
  <text x="410" y="124" fill="#4f46e5" font-size="9" text-anchor="middle">显式传入 (agent, user)；由 MemoryService 实现</text>
  <line x1="410" y1="132" x2="410" y2="148" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#tmg1)"/>
  <line x1="610" y1="70" x2="610" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="610" y1="140" x2="500" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="500" y1="140" x2="500" y2="148" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#tmg1)"/>
  <rect x="210" y="148" width="400" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.6"/>
  <text x="410" y="174" fill="#15803d" font-size="16" font-weight="bold" text-anchor="middle">MemoryService（门面）</text>
  <text x="410" y="194" fill="#166534" font-size="12" text-anchor="middle">统一门面，读写都走这里</text>
  <line x1="410" y1="204" x2="410" y2="224" stroke="#22c55e" stroke-width="1.8"/>
  <line x1="180" y1="224" x2="580" y2="224" stroke="#22c55e" stroke-width="1.8"/>
  <line x1="180" y1="224" x2="180" y2="254" stroke="#22c55e" stroke-width="1.8" marker-end="url(#tmg2)"/>
  <line x1="580" y1="224" x2="580" y2="254" stroke="#22c55e" stroke-width="1.8" marker-end="url(#tmg2)"/>
  <text x="580" y="218" fill="#64748b" font-size="10" text-anchor="middle">仅长期记忆（进 prompt）</text>
  <text x="180" y="218" fill="#64748b" font-size="10" text-anchor="middle">Session 读写（不进 prompt）</text>
  <rect x="40" y="256" width="280" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="280" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">SessionManager</text>
  <text x="180" y="300" fill="#1e40af" font-size="11" text-anchor="middle">会话记忆 · 经 SessionStore 接口落 SQLite</text>
  <rect x="360" y="256" width="440" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2.2"/>
  <text x="580" y="276" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">LongTermMemoryStore（接口）</text>
  <text x="580" y="294" fill="#475569" font-size="10" text-anchor="middle">append / load / recallByKeyword / truncateIfNeeded（均带 (agent, user)）</text>
  <line x1="580" y1="302" x2="580" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="425" y1="318" x2="735" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="425" y1="318" x2="425" y2="334" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tmg1)"/>
  <line x1="580" y1="318" x2="580" y2="334" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tmg1)"/>
  <line x1="735" y1="318" x2="735" y2="334" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#tmg1)"/>
  <rect x="360" y="336" width="130" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="425" y="356" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">MarkdownMemoryStore</text>
  <text x="425" y="371" fill="#92400e" font-size="9" text-anchor="middle">默认 · MEMORY.md</text>
  <text x="425" y="382" fill="#92400e" font-size="9" text-anchor="middle">核心/归档分区</text>
  <rect x="515" y="336" width="130" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="580" y="356" fill="#075985" font-size="10" font-weight="bold" text-anchor="middle">SqliteMemoryStore</text>
  <text x="580" y="371" fill="#075985" font-size="9" text-anchor="middle">memory_entries 表</text>
  <text x="580" y="382" fill="#075985" font-size="9" text-anchor="middle">LIMIT 截断 · LIKE 检索</text>
  <rect x="670" y="336" width="130" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="735" y="356" fill="#6d28d9" font-size="10" font-weight="bold" text-anchor="middle">Mem0MemoryStore</text>
  <text x="735" y="371" fill="#6d28d9" font-size="9" text-anchor="middle">自托管 Mem0</text>
  <text x="735" y="382" fill="#6d28d9" font-size="9" text-anchor="middle">语义检索 · REST</text>
  <text x="410" y="416" fill="#64748b" font-size="11" text-anchor="middle">长期记忆读路径经 core 的 LongTermMemoryView 接口（由 MemoryService 实现）；写入走 MemoryTools → MemoryService</text>
  <text x="410" y="432" fill="#64748b" font-size="11" text-anchor="middle">长期记忆经 LongTermMemoryStore 接口按 memory.backend 三选一，换后端上层一个字不动</text>
</svg>
